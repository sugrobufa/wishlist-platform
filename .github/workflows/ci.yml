name: CI

on:
  push:
    branches: [main]
  pull_request:

# Один прогон на ветку. Проверка всегда идёт по ВЕРШИНЕ ветки, поэтому пока
# новый пуш ждёт очереди, старый прогон уже проверяет неактуальный код —
# отменяем его, а не держим.
#
# Зачем это понадобилось (06.08.2026): с переходом на «пуш после каждого
# тикета» в моменте висело по два-три прогона сразу. В тот же вечер GitHub
# деградировал и не отдавал собственные экшены («Failed to resolve action
# download info»), и каждый параллельный прогон натыкался на это независимо:
# пять падений подряд при том, что код был зелёным локально. Один прогон
# вместо трёх — втрое меньше попаданий в такое окно и быстрее ответ.
#
# У выката (deploy.yml) группа СВОЯ и с `cancel-in-progress: false` — там
# отменять нельзя: выпуск, начавший катиться на сервер, обязан доехать.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: wishlist
          POSTGRES_PASSWORD: wishlist
          POSTGRES_DB: wishlist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wishlist"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://wishlist:wishlist@localhost:5432/wishlist
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: wishlist
      S3_PRIVATE_BUCKET: wishlist-private
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      AUTH_SECRET: ci-only-secret
      AUTH_TRUST_HOST: "true"
    steps:
      - uses: actions/checkout@v4

      # MinIO шагом, не сервисом: GitHub services не умеют передавать команду
      # (`server /data`), а bitnami-обёртка ушла из публичного каталога.
      # Бакеты создаёт сам код (ensureBucket, тикет 04).
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Design tokens (from handoff)
        run: npm run tokens

      - name: Prisma generate & validate
        run: npx prisma generate && npx prisma validate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

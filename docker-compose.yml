services:
  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "5432:5432"
    # ВНИМАНИЕ: настройки ТОЛЬКО для локальной разработки и тестов.
    # Прод живёт в docker-compose.prod.yml с обычной долговечностью.
    # Причина: ~10 процессов vitest бьют в одну базу разом; на дефолтных
    # параметрах чекпоинт занимал 10 с (видно в логах), beforeAll не
    # укладывался в таймаут, и тесты целыми файлами уходили в skipped.
    # Здесь данные одноразовые, поэтому отключаем гарантии записи на диск:
    # база держит нагрузку, а потеря dev-данных при аварии ничего не стоит.
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
      -c checkpoint_timeout=30min
      -c max_wal_size=4GB
      -c shared_buffers=256MB
      -c max_connections=200
    environment:
      POSTGRES_USER: wishlist
      POSTGRES_PASSWORD: wishlist
      POSTGRES_DB: wishlist
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wishlist"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
